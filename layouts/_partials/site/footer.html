{{- $groups := hugo.Data.navigation.footer -}}
<footer class="site-footer">
  <div class="site-footer__row">
    {{ range $groups }}
      <div>
        <h2>{{ .title }}</h2>
        <ul>
          {{ range .items }}
            <li><a href="{{ .url }}"{{ if hasPrefix .url "http" }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .name }}</a></li>
          {{ end }}
        </ul>
      </div>
    {{ end }}
  </div>
  <div class="site-footer__base">
    &copy; {{ now.Year }} {{ hugo.Data.profile.name }}. Built with Hugo. No trackers, no analytics.
  </div>
</footer>
