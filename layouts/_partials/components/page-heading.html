{{- $title := .title -}}
{{- $description := .description -}}
{{- $eyebrow := .eyebrow -}}
<header class="page-heading">
  {{ with $eyebrow }}<p class="page-heading__eyebrow">{{ . }}</p>{{ end }}
  <h1>{{ $title }}</h1>
  {{ with $description }}<p class="page-heading__desc">{{ . }}</p>{{ end }}
  {{ with .navItem }}{{ partial "components/subnav.html" (dict "navItem" . "current" $.current) }}{{ end }}
</header>
