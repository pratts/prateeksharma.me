{{- $parts := .parts | default slice -}}
{{- $message := .message | default "Nothing here yet." -}}
<p class="empty-note">
  {{- if gt (len $parts) 0 -}}
    {{- range $parts -}}
      {{- if eq .type "code" -}}<code>{{ .text }}</code>{{- else -}}{{ .text }}{{- end -}}
    {{- end -}}
  {{- else -}}
    {{ $message }}
  {{- end -}}
</p>
