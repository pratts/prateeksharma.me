{{- $page := .page -}}
{{- $cats := $page.Params.categories | default slice -}}
{{- $tags := $page.Params.tags | default slice -}}
{{- if or $cats $tags }}
<div class="tag-row">
  {{ range $cats }}<a class="tag--category" href="{{ (printf "/categories/%s/" (. | urlize)) | relURL }}">{{ . }}</a>{{ end }}
  {{ range $tags }}<a href="{{ (printf "/tags/%s/" (. | urlize)) | relURL }}">#{{ . }}</a>{{ end }}
</div>
{{- end -}}
