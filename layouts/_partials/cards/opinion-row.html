{{- $p := . -}}
<article class="group relative border-b border-slate-200/80 py-4 last:border-b-0 dark:border-slate-700/50">
  <div class="flex flex-col gap-1.5 sm:flex-row sm:items-baseline sm:gap-4">
    {{ if not $p.Date.IsZero }}
      <time class="shrink-0 font-mono text-xs nerdy-muted-soft sm:w-24" datetime="{{ $p.Date.Format "2006-01-02" }}">{{ $p.Date.Format "2006-01-02" }}</time>
    {{ end }}
    <div class="min-w-0">
      <h3 class="text-base font-semibold nerdy-card-title nerdy-title-accent-amber">
        <a href="{{ $p.RelPermalink }}" class="after:absolute after:inset-0">{{ $p.Title }}</a>
      </h3>
      {{ with $p.Params.description | default $p.Summary }}<p class="mt-1 line-clamp-2 text-sm leading-6 nerdy-muted">{{ . | plainify }}</p>{{ end }}
      {{ with $p.Params.tags }}
        <div class="mt-2 flex flex-wrap gap-1.5">
          {{ range first 4 . }}<span class="nerdy-chip nerdy-chip-amber">#{{ . }}</span>{{ end }}
        </div>
      {{ end }}
    </div>
  </div>
</article>
