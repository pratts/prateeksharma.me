baseURL = "https://prateeksharma.me/"
defaultContentLanguage = "en"
title = "Prateek Sharma"
enableRobotsTXT = true
enableEmoji = true
summaryLength = 40

[languages.en]
  locale = "en-us"
  weight = 1

[pagination]
  pagerSize = 20

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  description = "Prateek Sharma — software engineer focused on backend systems, distributed systems, databases, and infrastructure. Writing, projects, open source, experience, and books."
  author = "Prateek Sharma"
  images = ["images/profile.jpg"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    noClasses = true
    lineNos = false
    tabWidth = 2
    style = "github-dark"

[outputs]
  home = ["HTML", "RSS", "robots"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML", "RSS"]

[services]
  [services.rss]
    limit = 30

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[minify]
  disableXML = true

[related]
  threshold = 80
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 70
  [[related.indices]]
    name = "date"
    weight = 10

[permalinks]
  blog = "/blog/:contentbasename/"
  opinions = "/opinions/:contentbasename/"
  notes = "/notes/:contentbasename/"
  projects = "/projects/:contentbasename/"
  "open-source" = "/open-source/:contentbasename/"
