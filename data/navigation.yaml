# Data-driven navigation.
#
# The header renders only the top-level `main` entries (flat, by design — see
# README). `children` still exists on entries so the model supports nesting:
#
#   - Writing's hub (layouts/writing/section.html) reads each child's
#     `section` to pull that Hugo section's pages generically — adding a
#     fourth writing kind is a data change plus one new content section, not
#     a template change.
#   - Books' subnav (layouts/books/*.html) only reads each child's
#     `name`/`url` to render the Bookshelf/Reviews link row; the bookshelf's
#     own grouping logic (by `status`) and the reviews filter (`review:
#     true`) are bespoke to books and live in the templates themselves.
main:
  - name: Writing
    url: /writing/
    children:
      - name: Blog
        url: /blog/
        section: blog
      - name: Opinions
        url: /opinions/
        section: opinions
      - name: Notes
        url: /notes/
        section: notes
  - name: Projects
    url: /projects/
  - name: Open Source
    url: /open-source/
  - name: Experience
    url: /experience/
  - name: Books
    url: /books/
    children:
      - name: Bookshelf
        url: /books/
      - name: Reviews
        url: /books/reviews/
  - name: About
    url: /about/

footer:
  - title: Writing
    items:
      - name: Blog
        url: /blog/
      - name: Opinions
        url: /opinions/
      - name: Notes
        url: /notes/
  - title: Work
    items:
      - name: Projects
        url: /projects/
      - name: Open Source
        url: /open-source/
      - name: Experience
        url: /experience/
  - title: Index
    items:
      - name: Books
        url: /books/
      - name: Categories
        url: /categories/
      - name: Tags
        url: /tags/
  - title: Elsewhere
    items:
      - name: GitHub
        url: https://github.com/pratts
      - name: LinkedIn
        url: https://www.linkedin.com/in/prateeksharma28/
      - name: Résumé
        url: /resume/
      - name: RSS
        url: /blog/index.xml
