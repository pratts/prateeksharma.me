# Data-driven navigation. Add items or nested `children` here — no template changes needed.
# `url` may be an internal path (starts with /) or an external URL.
# A top-level item with `children` renders as an accessible disclosure menu.
#
# Writing and Books are "hub" entries: their own section templates
# (layouts/writing/section.html, layouts/books/*.html) read this entry's
# `children` to know which content sections/views to aggregate, deriving the
# Hugo section name from the last path segment of each child's `url`. Adding
# a fourth writing kind later (e.g. Essays) is: a new content/essays/ section
# with page.html/section.html copied from opinions/, one child entry here,
# and one label in layouts/_partials/cards/writing-row.html — no rewrite of
# the hub template itself. The same goes for a later top-level group like
# Knowledge (Books, Papers, Courses) or nested Projects (Personal,
# Experiments): add the group here first.
main:
  - name: About
    url: /about/
  - name: Experience
    url: /experience/
  - name: Projects
    url: /projects/
  - name: Open Source
    url: /open-source/
  - name: Writing
    url: /writing/
    children:
      - name: Blog
        url: /blog/
      - name: Opinions
        url: /opinions/
      - name: Notes
        url: /notes/
  - name: Books
    url: /books/
    children:
      - name: Bookshelf
        url: /books/
      - name: Reviews
        url: /books/reviews/
      - name: Reading List
        url: /books/reading-list/
  - name: Tags
    url: /tags/

# Footer link groups.
footer:
